<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="t d"><title id="t">Azure host and Ginux guest boundaries</title><desc id="d">Private administrator access enters an Ubuntu Azure virtual machine. A managed identity fetches a SHA-256-pinned artifact from private Blob Storage. QEMU runs the independent Ginux kernel inside the Ubuntu host.</desc><rect width="1000" height="530" fill="#FAFAFA"/><g font-family="Inter,Arial,sans-serif" fill="#101418"><rect x="180" y="35" width="790" height="450" rx="14" fill="#E7F6EE" stroke="#05A451" stroke-width="2"/><text x="205" y="65" font-size="19" font-weight="700">Azure VNet: private VM, explicit outbound connectivity</text><rect x="205" y="90" width="490" height="350" rx="12" fill="white" stroke="#52525B"/><text x="225" y="122" font-size="19" font-weight="700">Ubuntu 24.04 Gen2 Azure VM</text><text x="225" y="148" font-size="15">Trusted Launch · Secure Boot · vTPM · SSH</text><rect x="225" y="175" width="450" height="235" rx="10" fill="#F4F4F5" stroke="#A1A1AA"/><text x="245" y="204" font-size="18" font-weight="700">QEMU TCG / Q35 / OVMF</text><text x="245" y="230" font-size="15">1 vCPU · 2 GiB · virtual IOMMU 48</text><rect x="245" y="255" width="410" height="125" rx="9" fill="#09090B"/><text x="265" y="288" font-size="18" font-weight="700" fill="#FAFAFA">THOX Ginux kernel</text><text x="265" y="316" font-size="15" fill="#FAFAFA">EFI boot, ring-3 controller, Linux ABI</text><text x="265" y="345" font-size="14" fill="#A1A1AA">Domain execution has its own acceptance gate</text><rect x="725" y="100" width="220" height="145" rx="10" fill="white" stroke="#52525B"/><text x="745" y="132" font-size="18" font-weight="700">Private Blob</text><text x="745" y="162" font-size="15">Versioned release ZIP</text><text x="745" y="188" font-size="15">Whole-artifact SHA-256</text><text x="745" y="217" font-size="14">Managed identity read</text><rect x="725" y="290" width="220" height="115" rx="10" fill="white" stroke="#52525B"/><text x="745" y="322" font-size="18" font-weight="700">NAT Gateway</text><text x="745" y="351" font-size="15">Explicit outbound only</text><text x="745" y="377" font-size="14">Package/artifact access</text><rect x="15" y="170" width="140" height="125" rx="10" fill="white" stroke="#52525B"/><text x="32" y="202" font-size="17" font-weight="700">Administrator</text><text x="32" y="230" font-size="14">Bastion / VPN /</text><text x="32" y="253" font-size="14">private SSH</text><path d="M155 232H205M195 224L205 232L195 240" stroke="#047C3D" stroke-width="3" fill="none"/><path d="M725 172H695M705 164L695 172L705 180" stroke="#047C3D" stroke-width="3" fill="none"/><text x="218" y="470" font-size="14">Azure boots Linux. QEMU boots Ginux. No native Azure Ginux or Windows AVD claim.</text></g></svg>