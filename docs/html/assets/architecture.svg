<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" role="img" aria-labelledby="title desc"><title id="title">KnightHub external SSD host and research guest</title><desc id="desc">A Linux host boots on external SSD. Docker launches QEMU, which presents the supported virtual hardware to a Ginux UEFI guest. Ginux domains run selected Linux userspaces. The NVIDIA GPU remains owned by Linux.</desc><rect x="1" y="1" width="878" height="408" rx="12" fill="#f7faf8" stroke="#a8bdb0"/><g font-family="Inter,Arial,sans-serif" fill="#101418"><text x="26" y="35" font-size="20" font-weight="700">KnightHub · external SSD Linux host</text><text x="26" y="61" font-size="14">UEFI → existing THOX Linux image · host owns USB, NVIDIA and physical network</text><rect x="26" y="83" width="828" height="297" rx="10" fill="#eef6f1" stroke="#05A451"/><text x="46" y="111" font-size="18" font-weight="700">Docker runtime → QEMU process</text><text x="46" y="137" font-size="14">One virtual CPU · 2 GiB guest RAM · Q35 · OVMF · Intel IOMMU · virtio block + network</text><rect x="46" y="157" width="788" height="197" rx="8" fill="#fff" stroke="#b4c8bc"/><text x="66" y="187" font-size="18" font-weight="700">Ginux UEFI guest · THOX research banner</text><text x="66" y="213" font-size="14">Independent Rust kernel + ring-3 controller · serial console</text><rect x="66" y="233" width="365" height="96" rx="6" fill="#f7faf8" stroke="#c5d6cc"/><text x="84" y="263" font-size="16" font-weight="700">Linux-personality domains</text><text x="84" y="290" font-size="14">Upstream: selected Alpine / Rocky</text><text x="84" y="312" font-size="14">This kit: execution unqualified</text><rect x="448" y="233" width="365" height="96" rx="6" fill="#f7faf8" stroke="#c5d6cc"/><text x="466" y="263" font-size="16" font-weight="700">Persistent guest volume</text><text x="466" y="290" font-size="14">Configuration + verified OCI cache</text><text x="466" y="312" font-size="14">Domain writable persistence incomplete</text></g></svg>