# Azure host time through the Hyper-V PTP clock (Azure time sync guidance).
# chronyd stops with a fatal error when a refclock device is missing, so the
# refclock line is written to /run only when /dev/ptp_hyperv exists
# (/usr/lib/thoxos-g/chrony-azure-ptp, run before chronyd starts). Off Azure
# chrony keeps its NTP pool.
include /run/thoxos-g/chrony/*.conf
