# ThoxOS Desktop login (TXF 5.2 surface 2): wallpaper, theme, one green focus ring.
[greeter]
background=/usr/share/backgrounds/thoxos/thoxos-login.png
user-background=false
theme-name=ThoxOS-Slate
icon-theme-name=ThoxOS-Papirus-Dark
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
clock-format=%a %b %-d  %-I:%M %p
indicators=~host;~spacer;~clock;~spacer;~session;~power
position=50%,center 50%,center
default-user-image=#thoxos-mark
round-user-image=true
