# ThoxOS Ginux Edition on Azure: cloud-init provisions the administrator.
#
# Azure first; NoCloud lets the same image boot from a seed ISO for local tests.
datasource_list: [ Azure, NoCloud ]
datasource:
  Azure:
    apply_network_config: false
# systemd-networkd owns the network (DHCP on eth0); see 20-thoxos-wired.network.
network:
  config: disabled
# thoxos-g-growroot.service grows the root partition once, on first boot.
growpart:
  mode: "off"
resize_rootfs: false
system_info:
  default_user:
    name: thox
    lock_passwd: true
    gecos: ThoxOS administrator
    groups: [adm, sudo, kvm, systemd-journal]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
