# ThoxOS Ginux Edition local OCI registry (CNCF Distribution v2).
#
# Serves the ThoxOS userspace image to the Ginux network service. Listens on
# host loopback only; the QEMU user network maps the guest's 10.0.2.2 to it.
# Read-only at runtime: the image store is seeded at build time and nothing
# inside the guest can push to it.
version: 0.1
log:
  level: info
  formatter: text
  accesslog:
    disabled: false
storage:
  filesystem:
    rootdirectory: /var/lib/thoxos-g/registry
  delete:
    enabled: false
  maintenance:
    uploadpurging:
      enabled: false
    readonly:
      enabled: true
http:
  addr: 127.0.0.1:443
  tls:
    certificate: /etc/thoxos-g/tls/registry.crt
    key: /etc/thoxos-g/tls/registry.key
    minimumtls: tls1.2
  headers:
    X-Content-Type-Options: [nosniff]
health:
  storagedriver:
    enabled: true
    interval: 30s
    threshold: 3
