# ThoxOS Ginux Edition DNS forwarder for the QEMU guest.
#
# The Ginux controller is pointed at 10.0.2.2 (QEMU user-network alias for host
# loopback), which reaches this forwarder on 127.0.0.1:53. It answers the local
# registry name itself and forwards everything else upstream, so Docker Hub and
# package mirrors still resolve inside ThoxOS.
listen-address=127.0.0.1
bind-interfaces
port=53
no-hosts
domain-needed
bogus-priv
cache-size=1000
address=/registry.thoxos.internal/10.0.2.2
# The upstream resolver file is set per host by the caller:
#   Docker demo:   --resolv-file=/etc/resolv.conf
#   KnightHub SSD: --resolv-file=/run/systemd/resolve/resolv.conf
