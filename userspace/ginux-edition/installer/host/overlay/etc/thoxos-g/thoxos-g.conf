# ThoxOS Ginux Edition on KnightHub (i7-14700F, 126 GB RAM).
# Environment variables of the same name override these values.
THOXOS_G_STATE_DIR=/var/lib/thoxos-g/state
THOXOS_G_ACCEL=auto
# Ginux identity-maps only the first 4 GiB of guest RAM, so the VM stays at
# 2 GiB (the VM size upstream uses for its Rocky dnf test, with a 2048 MiB
# domain) even on a 126 GB host.
THOXOS_G_MEMORY=2G
THOXOS_G_DOMAIN_MEMORY_MIB=2048
THOXOS_G_VOLUME_SIZE=64G
THOXOS_G_BOOT_TIMEOUT=600
# tty1 boots the ThoxOS shell domain (interactive). Set system for the full
# systemd boot to the login prompt (login does not complete on Ginux 36503bd).
THOXOS_G_MODE=shell
