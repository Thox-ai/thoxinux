[workspace]
members = ["."]
resolver = "2"

[package]
name = "thox-agentos"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ThoxOS agentic layer: agent supervisor daemon, signed agent identities, capability tool broker, and the user-swappable kernel model slot."
homepage = "https://thox.ai"
repository = "https://github.com/Thox-ai"

[lib]
name = "thox_agentos"
path = "src/lib.rs"

[[bin]]
name = "thox-agentd"
path = "src/bin/thox-agentd.rs"

[[bin]]
name = "thox-agent"
path = "src/bin/thox-agent.rs"

[[bin]]
name = "thox-reporter"
path = "src/bin/thox-reporter.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# Already in the dependency graph (via getrandom); used directly for
# signal delivery to supervised process groups and for installing the
# daemon shutdown signal handlers.
libc = "0.2"
