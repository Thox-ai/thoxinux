# ThoxOS Ginux Edition: unit tests and static checks on every change to the module.
# Installed at .github/workflows/ginux-edition-ci.yml in the repository root.
name: ginux-edition-ci

on:
  push:
    paths: ["ginux-edition/**", ".github/workflows/ginux-edition-ci.yml"]
  pull_request:
    paths: ["ginux-edition/**", ".github/workflows/ginux-edition-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ginux-edition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: |
          python -m pip install --upgrade pip pytest
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: make test
        run: make test
